<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign In | Muhammad Shaban</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Rubik','sans-serif']}}}}</script>
  <style>h1,h2{font-family:'Libre Baskerville',serif}</style>
</head>
<body data-root="../../" class="bg-[#e4e8ec] text-slate-700 font-sans antialiased">

  <!-- Header / Navigation Placeholder -->
  <header id="nav"></header>

  <!-- Main Content -->
  <main id="main" class="max-w-6xl mx-auto px-4 pt-10">
    
    <!-- Breadcrumb Navigation -->
    <nav aria-label="Breadcrumb" class="text-sm text-slate-600 mb-6">
      <ol class="flex items-center gap-2">
        <li><a href="../../index.html" class="hover:text-[#f25a47]">Home</a></li>
        <li aria-hidden="true">/</li>
        <li aria-current="page" class="text-[#f25a47]">Sign In</li>
      </ol>
    </nav>

    <!-- Sign In Card Section -->
    <section aria-labelledby="signin-heading" class="grid md:grid-cols-2 rounded-3xl overflow-hidden border border-slate-200 bg-white">
      
      <!-- Left Promotional / Welcome Panel -->
      <aside aria-label="Welcome banner" class="relative hidden md:flex flex-col overflow-hidden bg-gradient-to-br from-[#0b2557] to-[#13357a] text-white p-10">
        <div class="absolute -top-16 -right-16 w-56 h-56 rounded-full border-[28px] border-[#f25a47]/20" aria-hidden="true"></div>
        <div class="absolute top-1/3 -left-10 w-28 h-28 rounded-full bg-[#f25a47]/20" aria-hidden="true"></div>
        <div class="absolute inset-0 opacity-10" style="background-image:radial-gradient(#fff 1px,transparent 1px);background-size:22px 22px" aria-hidden="true"></div>
        
        <div class="relative">
          <p class="text-xs uppercase tracking-widest text-[#f25a47] font-semibold">Muhammad Shaban · Web Developer</p>
          <h2 class="mt-3 text-3xl font-bold text-white leading-snug">Welcome back!</h2>
          <p class="mt-3 text-sm text-slate-300 max-w-sm">Sign in to continue exploring my work, projects and skills.</p>
          
          <ul class="mt-5 flex flex-wrap gap-2" aria-label="Developer tech stack">
            <li class="px-3 py-1 rounded-full bg-white/10 border border-white/20 text-xs">HTML5</li>
            <li class="px-3 py-1 rounded-full bg-white/10 border border-white/20 text-xs">Tailwind CSS</li>
            <li class="px-3 py-1 rounded-full bg-white/10 border border-white/20 text-xs">JavaScript</li>
            <li class="px-3 py-1 rounded-full bg-white/10 border border-white/20 text-xs">Git</li>
          </ul>
        </div>

        <figure class="relative mt-auto -mx-10 -mb-10 pt-10 flex justify-center">
          <div class="relative w-[21rem]">
            <div class="absolute inset-x-4 bottom-0 top-10 rounded-full bg-[#e4e8ec]" aria-hidden="true"></div>
            <img src="../../assets/images/shaban-cutout.png" class="relative w-full" alt="Portrait of Muhammad Shaban">
            <div class="absolute top-14 -left-8 bg-white text-[#0b2557] rounded-xl shadow-xl px-3 py-2 text-xs font-semibold">⚡ 5 Pages Built</div>
            <div class="absolute bottom-24 -right-8 bg-[#f25a47] text-white rounded-xl shadow-xl px-3 py-2 text-xs font-semibold">📱 Fully Responsive</div>
          </div>
        </figure>
      </aside>

      <!-- Right Form Panel -->
      <div class="p-8 md:p-10">
        <header>
          <h1 id="signin-heading" class="text-3xl font-extrabold text-[#0b2557]">Sign In</h1>
          <p class="text-slate-600 mt-1 mb-6">Access your account.</p>
        </header>

        <output id="ok" class="hidden mb-4 block p-3 rounded-lg bg-[#f25a47]/10 border border-[#f25a47]/30 text-[#c93a28] text-sm">✔ Submitted successfully (demo form).</output>

        <form id="authForm" class="space-y-4">
          <div>
            <label for="signin-email" class="block text-sm mb-1 font-medium">Email</label>
            <input id="signin-email" name="email" type="email" required placeholder="you@example.com" class="w-full rounded-lg bg-slate-100 border border-slate-300 px-4 py-2.5 focus:outline-none focus:border-[#f25a47]">
          </div>

          <div>
            <label for="signin-password" class="block text-sm mb-1 font-medium">Password</label>
            <input id="signin-password" name="password" type="password" required minlength="6" placeholder="••••••••" class="w-full rounded-lg bg-slate-100 border border-slate-300 px-4 py-2.5 focus:outline-none focus:border-[#f25a47]">
          </div>

          <div class="flex justify-between items-center text-sm">
            <label for="remember-me" class="flex items-center gap-2 cursor-pointer">
              <input id="remember-me" name="remember" type="checkbox" class="accent-[#f25a47]">
              <span>Remember me</span>
            </label>
            <a href="contact.html" class="text-[#f25a47] hover:underline">Forgot password?</a>
          </div>

          <button type="submit" class="w-full py-3 rounded-lg bg-[#f25a47] text-white font-semibold hover:bg-[#e0452f] transition">Sign In</button>
        </form>

        <div class="flex items-center gap-3 my-5 text-xs text-slate-500" aria-hidden="true">
          <span class="flex-1 h-px bg-slate-300"></span>OR<span class="flex-1 h-px bg-slate-300"></span>
        </div>

        <button type="button" class="w-full py-3 rounded-lg border border-slate-300 hover:border-[#f25a47] transition font-medium">Continue with Google</button>

        <footer class="mt-6 text-sm text-slate-600 text-center">
          <p>No account? <a href="signup.html" class="text-[#f25a47] font-semibold hover:underline">Sign Up</a></p>
        </footer>
      </div>

    </section>

  </main>

  <!-- Footer Placeholder -->
  <footer id="foot"></footer>

  <script src="../../assets/js/layout.js"></script>
</body>
</html>
